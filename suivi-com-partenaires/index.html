/* ---------- Comptes rendus ---------- */
function reportData(pid,ym,exclude,proj){
 const p=partner(pid);
 const cs=S.contents.filter(c=>c.partnerId===pid&&!c.aside&&projOk(c,proj)&&c.share&&!(exclude||[]).includes(c.id)&&(c.platforms||[]).some(x=>x.date&&x.date.startsWith(ym)))
  .sort((a,b)=>((firstPub(a)||{}).date||'').localeCompare((firstPub(b)||{}).date||''));
 const evs=S.events.filter(e=>e.partnerId===pid&&e.date.startsWith(ym));
 return {p,cs,evs};
}
function reportCandidates(pid,ym){return S.contents.filter(c=>c.partnerId===pid&&!c.aside&&projOk(c,ui.rep.project)&&(c.platforms||[]).some(x=>x.date&&x.date.startsWith(ym)))}
function buildReport(pid,ym,opts,exclude){
 const {p,cs,evs}=reportData(pid,ym,exclude,opts.project);
 const pages=[];
 const foot=(i,n)=>`<div class="rp-foot"><span>Compte rendu ${esc(p.name)} · ${fmtMonth(ym)}</span><span>Document préparé le ${fmtDY(TODAY)} · page ${i}/${n}</span></div>`;
 // Page 1
 const ym1=ym+'-01';const start=addDays(ym1,-dow(ym1));const nd=new Date(D(ym1).getFullYear(),D(ym1).getMonth()+1,0).getDate();const cells=Math.ceil((dow(ym1)+nd)/7)*7;const rows=cells/7;
 const pubsByDay={};cs.forEach(c=>(c.platforms||[]).forEach(x=>{if(x.date&&x.date.startsWith(ym))(pubsByDay[x.date]=pubsByDay[x.date]||[]).push({c,x})}));
 Object.values(pubsByDay).forEach(l=>l.sort((a,b)=>(a.x.time||'').localeCompare(b.x.time||'')));
 const st={total:cs.length,pub:cs.filter(c=>gstat(c)==='publie').length,att:cs.filter(c=>gstat(c)==='attente').length,val:cs.filter(c=>gstat(c)==='valide').length};
 const calH=opts.chiffres?600:700;const cellH=Math.floor((calH-24)/rows);
 const p1=()=>`
  <div style="height:7px;margin:-48px -52px 41px;background:${p.color||'#0E0E0E'}"></div><div class="rp-top"><div><div class="rp-kick">Compte rendu de communication${pSub(p)?' · '+esc(pSub(p)):''}</div><div class="rp-title">${esc(p.name)}</div>${opts.project&&project(opts.project)?`<div style="font-size:15px;font-weight:700;margin-top:6px">Projet · ${esc(project(opts.project).name)}</div>`:''}<div class="rp-month">${fmtMonth(ym)}</div></div><div class="rp-logo" style="${logoStyle(p)};font-size:${logoFs(p,58)}px">${logoTxt(p)}</div></div>
  ${opts.chiffres?`<div class="rp-stats"><div class="rp-stat k"><b>${st.total}</b><span>Contenus du mois</span></div><div class="rp-stat"><b>${st.pub}</b><span>Publiés</span></div><div class="rp-stat"><b>${st.val}</b><span>Validés, à paraître</span></div><div class="rp-stat"><b>${st.att}</b><span>En attente de validation</span></div><div class="rp-stat"><b>${evs.length}</b><span>Événements</span></div></div>`:''}
  ${opts.calendrier?`<div class="rp-sec">Calendrier du mois</div><div class="rp-cal">${JOURS.map(j=>`<div class="rp-dow">${j}</div>`).join('')}${Array.from({length:cells},(_,i)=>{const d=addDays(start,i);const out=!d.startsWith(ym);const l=(pubsByDay[d]||[]);const e=evs.filter(x=>x.date===d);const maxN=Math.max(1,Math.floor((cellH-20)/23));const all=[...e.map(x=>`<div class="rp-ev e">${esc(x.title)}</div>`),...l.map(({c,x})=>`<div class="rp-ev"><img src="${thumbSrc(c)}" alt="">${esc(x.time||'')} ${PFA[x.platform]||''}</div>`)];return `<div class="rp-cell ${out?'out':''}" style="height:${cellH}px"><div class="rp-dn">${D(d).getDate()}</div>${out?'':all.slice(0,maxN).join('')+(all.length>maxN?`<div class="rp-more">+${all.length-maxN}</div>`:'')}</div>`}).join('')}</div>
  <div class="rp-legend"><span>■ Publication : miniature, horaire, plateforme</span><span style="color:#D9140E">■ Événement</span><span>IG Instagram · IN LinkedIn · TT TikTok · FB Facebook · YT YouTube · NL Newsletter</span></div>`:''}
  ${!opts.calendrier?`<div class="rp-sec">Contenus du mois</div>${cs.map(c=>`<div style="display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #EFECEA"><img src="${thumbSrc(c)}" style="width:28px;height:35px;border-radius:5px;object-fit:cover"><b style="font-size:12px;flex:1">${esc(c.title)}</b><span class="rp-chip s-${gstat(c)}">${GS[gstat(c)]}</span></div>`).join('')}`:''}`;
 // Pages détaillées
 const detail=[];let cur=[],h=0;const budget=900;
 cs.forEach(c=>{const ph=Math.max(200,96+(opts.descriptions?66:0)+Math.ceil(c.platforms.length/2)*(48+(opts.comptes?28:0)+(opts.collabs?14:0)+(opts.liens?10:0)));if(h+ph>budget&&cur.length){detail.push(cur);cur=[];h=0}cur.push(c);h+=ph});
 if(cur.length)detail.push(cur);
 const total=1+detail.length;
 pages.push(`<div class="rp-page">${p1()}${foot(1,total)}</div>`);
 detail.forEach((group,gi)=>{
  pages.push(`<div class="rp-page"><div style="height:7px;margin:-48px -52px 41px;background:${p.color||'#0E0E0E'}"></div><div class="rp-head2"><b>${esc(p.name)} — Détail des publications</b><span>${fmtMonth(ym)}</span></div>
  ${group.map(c=>{const s=gstat(c);const pr=c.projectId?project(c.projectId):null;
   const cols=['Plateforme','Date et heure'];if(opts.comptes)cols.push('Publié par','Identifications');if(opts.collabs)cols.push('Collaborations');cols.push('Statut');if(opts.liens)cols.push('Lien');
   return `<div class="rp-post"><div class="rp-pthumb"><img src="${thumbSrc(c)}" alt=""></div><div class="rp-pb"><div class="rp-pt">${esc(c.title)}</div>
   <div class="rp-chips"><span class="rp-chip s-${s}">${GS[s]}</span><span class="rp-chip">${esc(c.format)}</span>${pr?`<span class="rp-chip">${esc(pr.name)}</span>`:''}</div>
   ${opts.descriptions?`<div class="rp-desc">${esc(c.description||'Description à venir.')}</div>`:''}
   <div class="rp-pls">${c.platforms.map(x=>`<div class="rp-pl"><div class="rp-plh"><span class="rp-pfb">${PFA[x.platform]||''}</span><b>${esc(x.platform)}</b><span class="rp-plt">${x.date?fmtD(x.date):'—'}${x.time?' · '+esc(x.time):''}</span><span class="rp-cs ${x.status==='publie'?'c-acceptee':x.status==='programme'?'c-envoyee':''}">${PUB[x.status]}</span></div>${opts.comptes?`<div class="rp-l"><span>Publié par</span>${esc((x.accounts||[]).join(', ')||'—')}</div><div class="rp-l"><span>Identifications</span>${esc((x.tags||[]).join(', ')||'—')}</div>`:''}${opts.collabs&&(x.collabs||[]).length?`<div class="rp-l"><span>Collaborations</span><div>${x.collabs.map(k=>`${esc(k.account)}<span class="rp-cs c-${k.status}">${COLLAB[k.status]}</span>`).join('<br>')}</div></div>`:''}${opts.liens&&x.status==='publie'&&x.link?`<div class="rp-l"><span>Lien</span><a class="rp-link" href="${esc(x.link)}">Voir le post ↗</a></div>`:''}</div>`).join('')}</div>
   </div></div>`}).join('')}
  ${foot(gi+2,total)}</div>`);
 });
 if(!cs.length)pages[0]=pages[0].replace('<div class="rp-foot"',`<div style="margin-top:30px;padding:24px;border:1px dashed #CFCAC8;border-radius:14px;font-size:13px;color:#6E6866">Aucun contenu planifié pour ce mois avec la sélection actuelle.</div><div class="rp-foot"`);
 return pages;
}

function latestReport(pid,ym){return S.reports.filter(x=>x.partnerId===pid&&x.month===ym).sort((a,b)=>(b.sentAt?1:0)-(a.sentAt?1:0)||b.createdAt.localeCompare(a.createdAt))[0]||null}
function recapStatus(pid,ym){const r=latestReport(pid,ym);return {k:r?(r.sentAt?'sent':'ready'):'none',r}}
function fitPages(){document.querySelectorAll('.rp-fit').forEach(w=>{const s=Math.min(1,w.clientWidth/794);w.style.height=(1123*s)+'px';const pg=w.firstElementChild;if(pg)pg.style.transform=`scale(${s})`})}
addEventListener('resize',()=>{clearTimeout(fitPages.t);fitPages.t=setTimeout(fitPages,80)});

let DL=null;
(async()=>{try{if(window.claude&&window.claude.use)DL=await window.claude.use('downloads')}catch(e){DL=null}})();
async function exportPDF(){
 const r=ui.rep;
 if(!window.html2canvas||!window.jspdf){toast('Les outils de génération PDF ne sont pas chargés. Rechargez la page.',true);return}
 const dl=DL;
 if(!dl){toast('Le téléchargement n\'est pas disponible dans cette vue. Ouvrez l\'application dans claude.ai.',true);return}
 ui.busy=true;render();
 try{
  const pages=buildReport(r.partner,r.month,Object.assign({},r.opts,{project:r.project}),Object.keys(r.exclude).filter(k=>r.exclude[k]));
  const stage=document.getElementById('pdf-stage');stage.innerHTML=pages.join('');
  await Promise.all([...stage.querySelectorAll('img')].map(im=>im.complete?0:new Promise(res=>{im.onload=im.onerror=res})));
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  const els=[...stage.querySelectorAll('.rp-page')];
  for(let i=0;i<els.length;i++){const cv=await window.html2canvas(els[i],{scale:2,backgroundColor:'#ffffff',logging:false});if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297)}
  stage.innerHTML='';
  const p=partner(r.partner);const name=`Compte-rendu_${p.name.replace(/[^\wÀ-ÿ-]+/g,'-')}_${r.month}.pdf`;
  const blob=pdf.output('blob');
  ui.busy=false;render();
  try{await dl.save({filename:name,data:blob});let rec=latestReport(r.partner,r.month);if(!rec){rec={id:uid('r'),partnerId:r.partner,month:r.month,opts:clone(r.opts),exclude:Object.keys(r.exclude).filter(k=>r.exclude[k]),createdAt:nowStamp(),by:me().id,shared:false,sentAt:'',sentChannel:'',sentTo:'',sentBy:''};S.reports.push(rec)}ui.rep.lastExported=rec.id;commit('PDF prêt : '+name)}
  catch(e){toast(e&&e.code==='declined'?'Téléchargement annulé.':'Le PDF n\'a pas pu être enregistré ('+(e&&e.code||'erreur')+').',true)}
 }catch(e){ui.busy=false;render();toast('Erreur pendant la génération du PDF.',true)}
}

 if(!o){out.push('Fiche créée');}
 else{
  if(o.title!==n.title)out.push(`Titre modifié`);
  if(o.prod!==n.prod)out.push(`Production : ${PROD[o.prod]} → ${PROD[n.prod]}`);
  TASKS.forEach(([k,l])=>{const a=o.tasks&&o.tasks[k],b=n.tasks&&n.tasks[k];if(a&&b&&a.state!==b.state)out.push(`${l} : ${TSTATE[a.state]} → ${TSTATE[b.state]}`)});
  if(o.validation!==n.validation)out.push(`Validation : ${VAL[o.validation]} → ${VAL[n.validation]}`);
  if(o.prodDue!==n.prodDue)out.push(`Date de remise : ${fmtD(o.prodDue)} → ${fmtD(n.prodDue)}`);
  if(o.validationDue!==n.validationDue)out.push(`Échéance de validation : ${fmtD(o.validationDue)} → ${fmtD(n.validationDue)}`);
  if(o.blocked!==n.blocked)out.push(n.blocked?`Bloqué : ${n.blocker}`:'Blocage levé');

  if(o.thumb!==n.thumb)out.push('Miniature modifiée');
  n.platforms.forEach(p=>{const q=o.platforms.find(x=>x.id===p.id);if(!q){out.push(`Plateforme ajoutée : ${p.platform}`);return}
   if(q.date!==p.date||q.time!==p.time)out.push(`${p.platform} : ${fmtD(q.date)} ${q.time||''} → ${fmtD(p.date)} ${p.time||''}`);
   if(q.status!==p.status)out.push(`${p.platform} : ${PUB[q.status]} → ${PUB[p.status]}`);
   if(q.link!==p.link&&p.link)out.push(`${p.platform} : lien publié ajouté`);
   (p.collabs||[]).forEach(k=>{const kk=(q.collabs||[]).find(z=>z.account===k.account);if(!kk)out.push(`Collaboration ${k.account} : ${COLLAB[k.status]}`);else if(kk.status!==k.status)out.push(`Collaboration ${k.account} : ${COLLAB[kk.status]} → ${COLLAB[k.status]}`)});

 if(t.dataset.perm){if(!isAdmin())return;const [uid_,k]=t.dataset.perm.split('.');const u=S.users.find(x=>x.id===uid_);u.perms[k]=t.checked;commit(`Droit « ${PERMS.find(p=>p[0]===k)[1]} » ${t.checked?'accordé':'retiré'} à ${u.name}`);return}
 if(t.dataset.access){if(!can('acces_partenaires'))return;const [pid,k]=t.dataset.access.split('.');const p=partner(pid);p.access[k]=t.checked;if(k==='enabled'&&!t.checked&&S.currentUser==='partner:'+pid)S.currentUser='estelle';commit(k==='enabled'?(t.checked?`Accès ouvert pour ${p.name} · aucun envoi effectué`:`Accès retiré pour ${p.name}`):'Droits du partenaire mis à jour');return}
 if(t.dataset.accesstxt){if(!can('acces_partenaires'))return;const [pid,k]=t.dataset.accesstxt.split('.');partner(pid).access[k]=t.value;commit('Accès partenaire mis à jour');return}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.qlink!==undefined&&ui.modal&&ui.modal.type==='quick'){const c=content(ui.modal.id);const x=c.platforms[+t.dataset.qlink];x.link=t.value.trim();c.history.push({at:nowStamp(),by:me().id,text:`${x.platform} : lien publié mis à jour`});save();toast('Lien enregistré')}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='ci-file'&&t.files[0]){try{const txt=await t.files[0].text();const list=parseContacts(txt);if(!list.length){toast('Aucun contact trouvé dans ce fichier (formats .vcf ou .csv de Google Contacts).',true);return}ui.modalAnim=true;ui.modal={type:'cimport',draft:{partnerId:t.dataset.partner,list,sel:{},q:''}};renderModalOnly()}catch(err){toast('Fichier illisible.',true)}t.value='';return}
 if(t.dataset.ci!==undefined&&ui.modal&&ui.modal.type==='cimport'){ui.modal.draft.sel[t.dataset.ci]=t.checked;const c=document.querySelector('#modal-root .pb .muted');if(c)c.textContent=ui.modal.draft.list.length+' contact(s) dans le fichier · '+Object.values(ui.modal.draft.sel).filter(Boolean).length+' sélectionné(s)'}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='ci-q'&&ui.modal&&ui.modal.type==='cimport'){ui.modal.draft.q=t.value;clearTimeout(t._d);t._d=setTimeout(()=>{const pos=t.selectionStart;renderModalOnly();const n=document.getElementById('ci-q');if(n){n.focus();n.setSelectionRange(pos,pos)}},200)}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='cf-q'){ui.cf.q=t.value;clearTimeout(t._d);t._d=setTimeout(()=>{const pos=t.selectionStart;render();const n=document.getElementById('cf-q');if(n){n.focus();n.setSelectionRange(pos,pos)}},220)}});
document.addEventListener('submit',async e=>{
 const f=e.target;e.preventDefault();
 if(f.dataset.form==='auth'){const fd=new FormData(f);const email=String(fd.get('email')||'').trim().toLowerCase();const pw=String(fd.get('password')||'');ui.authEmail=email;ui.authErr='';ui.authOk='';ui.authBusy=true;render();const m=ui.authMode||'login';
  try{if(m==='login'){const {data,error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;ui.authBusy=false;await afterLogin(data.session);return}
   if(m==='signup'){const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin}});if(error)throw error;if(data.session){ui.authBusy=false;await afterLogin(data.session);return}ui.authOk='Compte créé. Si un email de confirmation arrive, cliquez sur le lien puis revenez vous connecter ici.';ui.authMode='login'}
   if(m==='magic'){const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin,shouldCreateUser:true}});if(error)throw error;ui.authOk='Lien envoyé. Ouvrez-le depuis cet appareil.'}
   if(m==='reset'){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});if(error)throw error;ui.authOk='Email envoyé. Suivez le lien pour choisir un nouveau mot de passe.'}
  }catch(err){const msg=String(err&&err.message||err);ui.authErr=/Invalid login/i.test(msg)?'Email ou mot de passe incorrect. Première connexion ? Utilisez « Première connexion » ou « Mot de passe oublié ».':/already registered/i.test(msg)?'Ce compte existe déjà : connectez-vous avec votre mot de passe ou utilisez « Mot de passe oublié ».':msg}
  ui.authBusy=false;render();return}
 if(f.dataset.form==='newpass'){const pw=String(new FormData(f).get('password')||'');const {data,error}=await sb.auth.updateUser({password:pw});if(error){ui.authErr=error.message;render();return}ui.authMode='login';const {data:{session}}=await sb.auth.getSession();if(session)await afterLogin(session);return}
 if(f.dataset.form==='member'){const fd=new FormData(f);const email=String(fd.get('email')||'').trim().toLowerCase();const prof=String(fd.get('profile')||'');if(!email||!prof)return;
  const row=prof.startsWith('partner:')?{email,app_user_id:prof,role:'partenaire',partner_id:prof.slice(8)}:{email,app_user_id:prof,role:(S.users.find(u=>u.id===prof)||{}).role==='admin'?'admin':'equipe',partner_id:null};
  const {error}=await sb.from('scp_members').upsert(row);if(error){toast(error.message,true);return}toast('Accès enregistré pour '+email+' · aucun email envoyé');f.reset();loadMembers();return}
 if(f.dataset.form==='project'){const fd=new FormData(f);const name=(fd.get('name')||'').trim();if(!name)return;S.projects.push({id:uid('pr'),partnerId:f.dataset.partner,name,desc:fd.get('desc')||'',start:fd.get('start')||TODAY,end:fd.get('end')||''});commit('Projet ajouté')}
 if(f.dataset.form==='user'){const fd=new FormData(f);const name=(fd.get('name')||'').trim();if(!name)return;S.users.push({id:uid('u'),name,role:'equipe',title:fd.get('title')||'Équipe',perms:{contenus_creer:false,contenus_modifier:false,production_avancer:false,publication_planifier:false,valider:false,echanges:true,partenaires_gerer:false,comptes_rendus:false,notes_internes:false,acces_partenaires:false,supprimer:false}});commit(name+' ajouté · réglez ses droits ci-dessus')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;renderModalOnly()}});
function navigate(r){if(r!=="contenus")ui.sel=null;ui.prjDel=null;ui.route=r;ui.anim=true;if(r==='administration')setTimeout(loadMembers,0);if(location.hash!=='#'+r)location.hash=r;render();window.scrollTo(0,0)}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==ui.route){ui.route=h;ui.anim=true;ui.modal=null;render();window.scrollTo(0,0)}});

/* ---------- Démarrage ---------- */
loadAll();
if(location.hash.length>1&&!/access_token|type=/.test(location.hash))ui.route=location.hash.slice(1);
if(S.partners.length&&!partner(ui.rep.partner))ui.rep.partner=S.partners[0].id;
render();
if(ONLINE){bootOnline().catch(e=>{ui.boot='error';ui.bootErr=e.message;render()});if(ui.route==='administration')setTimeout(loadMembers,1500)}
})();
</script>

</body>
</html>
