<!DOCTYPE html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #f4f4f5;
        background: radial-gradient(120% 80% at 50% 0%, #3b0764 0%, #0a0a0a 60%);
      }
      /* Zone de sécurité Reels : évite le haut (~220px) et le bas (~420px)
         où Instagram affiche l'interface (légende, boutons, pseudo). */
      .comp-layer {
        position: absolute;
        inset: 0;
      }
      .scene {
        position: absolute;
        top: 220px;
        bottom: 420px;
        left: 90px;
        right: 150px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 32px;
      }
      .kicker {
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #f0abfc;
      }
      .headline {
        font-size: 120px;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.04em;
      }
      .body {
        font-size: 52px;
        line-height: 1.3;
        color: #d4d4d8;
      }
      .cta {
        align-self: flex-start;
        padding: 28px 56px;
        border-radius: 999px;
        background: #f0abfc;
        color: #0a0a0a;
        font-size: 52px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qv3y" id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div data-hf-id="hf-rw2r" id="hook-layer" class="comp-layer" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5" data-track-index="0"></div>
      <div data-hf-id="hf-ho9t" id="message-layer" class="comp-layer" data-composition-id="message" data-composition-src="compositions/message.html" data-start="5" data-duration="5" data-track-index="1"></div>
      <div data-hf-id="hf-1iah" id="cta-layer" class="comp-layer" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="10" data-duration="5" data-track-index="2"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
